name: Release

# Every PR merged into main publishes the next version: the patch number goes up
# by default, or the minor/major number when the PR has the `minor` or `major` label.
# Run the workflow by hand on main to release again (e.g. after a failed run).
on:
  pull_request:
    types: [ closed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version part to increase'
        type: choice
        options: [ patch, minor, major ]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  release:
    name: Build & Publish Release
    if: github.event.pull_request.merged == true || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    env:
      COMMIT: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Next version
        id: version
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          $labels = @()
          if ($env:LABELS -and $env:LABELS -ne 'null') { $labels = @($env:LABELS | ConvertFrom-Json) }
          $bump = 'patch'
          if ($labels -contains 'minor') { $bump = 'minor' }
          if ($labels -contains 'major') { $bump = 'major' }
          if ($env:BUMP_INPUT) { $bump = $env:BUMP_INPUT }

          $latest = git tag --list 'v*' --sort=-v:refname |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            Select-Object -First 1
          $v = if ($latest) { [version]$latest.Substring(1) } else { [version]'0.0.0' }
          $next = switch ($bump) {
            'major' { "$($v.Major + 1).0.0" }
            'minor' { "$($v.Major).$($v.Minor + 1).0" }
            default { "$($v.Major).$($v.Minor).$($v.Build + 1)" }
          }
          "Latest: $latest, bump: $bump, next: v$next"
          "tag=v$next" >> $env:GITHUB_OUTPUT

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $pkg = "brightnessctl-$env:TAG-windows-x86_64"
          New-Item -ItemType Directory -Path "dist/$pkg" -Force | Out-Null
          Copy-Item target/release/brightnessctl.exe, README.md, LICENSE -Destination "dist/$pkg"
          Compress-Archive -Path "dist/$pkg/*" -DestinationPath "dist/$pkg.zip"
          Copy-Item target/release/brightnessctl.exe -Destination dist

          Push-Location dist
          Get-FileHash "$pkg.zip", brightnessctl.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content checksums.txt -Encoding ascii
          Get-Content checksums.txt
          Pop-Location

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create $env:TAG --target $env:COMMIT --title "brightnessctl $env:TAG" --generate-notes `
            "dist/brightnessctl-$env:TAG-windows-x86_64.zip" dist/brightnessctl.exe dist/checksums.txt
